# 로컬과 서버에서 동일하게 쓰는 전체 스택 정의.
# 구성: postgres, booking-api, mock-forwarder, worker, prometheus, grafana

services:
  postgres:
    image: postgres:17-alpine
    container_name: booking-postgres
    # 환경변수 값은 .env 에서 온다. compose 는 같은 디렉터리의 .env 를 자동으로 읽는다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 로컬 디버깅용으로만 호스트에 노출. 서버에서는 이 줄을 빼고 내부 네트워크로만 접근한다.
    ports:
      - "5432:5432"
    # 명명된 볼륨. 컨테이너를 지워도 데이터가 남는다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # DB 가 "실제로 접속 가능한 상태" 인지 compose 가 판단하는 기준.
    # pg_isready 는 postgres 이미지에 포함된 접속 확인 도구.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  booking-api:
    # 이미지 이름을 미리 정한 이유: 나중에 CI 가 GHCR 에 올릴 때 같은 이름을 쓴다.
    build: ./services/booking-api
    image: booking-api:local
    container_name: booking-api
    environment:
      PORT: "8080"
      # 호스트 이름 "postgres" 는 compose 가 만든 내부 네트워크의 서비스 이름이다.
      # 컨테이너 간 통신이므로 localhost 가 아니다.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Claude 파싱 설정. 키는 .env 에서만 온다. 모델·타임아웃은 장애 훈련 때 바꿔가며 쓴다.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      CLAUDE_TIMEOUT_MS: ${CLAUDE_TIMEOUT_MS:-10000}
    ports:
      - "8080:8080"
    # postgres 의 healthcheck 가 통과한 뒤에만 API 를 시작한다.
    # 단순 depends_on 은 "컨테이너 시작" 만 기다려서 DB 준비 전에 연결 시도가 실패할 수 있다.
    depends_on:
      postgres:
        condition: service_healthy
    # distroless 이미지에는 curl 이 없어 여기서 healthcheck 를 쓸 수 없다.
    # 대신 다음 단계에서 Prometheus 블랙박스/외부 healthcheck.sh 로 확인한다.
    restart: unless-stopped

  mock-forwarder:
    # 모의 외부 포워더. 환경변수로 장애를 주입한다. 상태는 메모리에만 있어 재시작하면 비워진다.
    build: ./services/mock-forwarder
    image: mock-forwarder:local
    container_name: mock-forwarder
    environment:
      PORT: "8082"
      # 장애 주입 노브. 기본값은 전부 "정상". 훈련 때 .env 에서 바꾸고 `docker compose up -d mock-forwarder` 로 재적용.
      FAIL_RATE: ${FWD_FAIL_RATE:-0}            # 0~1. 이 확률로 500 (저장 안 함)
      DELAY_MS: ${FWD_DELAY_MS:-0}              # 응답 지연. 3000 이상이면 worker 타임아웃
      DUP_RATE: ${FWD_DUP_RATE:-0}              # 0~1. 저장 후 500 (응답 유실) -> 재전송 멱등성 검증
      OUT_OF_ORDER: ${FWD_OUT_OF_ORDER:-false}  # true 면 GET 이 30% 확률로 옛 상태(pending) 반환
      CONFIRM_AFTER_MS: ${FWD_CONFIRM_AFTER_MS:-5000}
    ports:
      - "8082:8082"   # 로컬 디버깅용. 서버에서는 뺀다 (worker 만 내부 네트워크로 접근)
    restart: unless-stopped

  worker:
    build: ./services/worker
    image: worker:local
    container_name: booking-worker
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      FORWARDER_URL: http://mock-forwarder:8082
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_HTTP_TIMEOUT_MS: ${WORKER_HTTP_TIMEOUT_MS:-3000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      WORKER_BACKOFF_BASE_MS: "1000"
      WORKER_BACKOFF_MAX_MS: "30000"
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-60000}
    ports:
      - "8081:8081"   # /healthz, /metrics 로컬 확인용
    # DB 준비 + booking-api 가 마이그레이션(002 컬럼)을 끝낸 뒤 시작해야 한다.
    # booking-api 에는 healthcheck 가 없어 service_started 만 기다린다. 컬럼이 아직 없으면 claim 이 실패 로그를 내고
    # 다음 틱에 재시도하므로 (폴러는 죽지 않음) 시작 순서 경쟁은 자연 해소된다.
    depends_on:
      postgres:
        condition: service_healthy
      booking-api:
        condition: service_started
      mock-forwarder:
        condition: service_started
    # 종료 시 SIGTERM 후 이 시간 안에 안 내려가면 SIGKILL. worker 드레인(HTTP 3s + DB 쓰기)에 충분한 여유.
    stop_grace_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: booking-prometheus
    # 설정 파일은 읽기 전용(:ro) 으로 마운트. 컨테이너가 설정을 바꿀 이유가 없다.
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d   # 로컬은 7일만 보관. 디스크 사용량 상한 역할.
      - --web.enable-lifecycle              # POST /-/reload 로 설정 재적용 (재시작 없이)
    ports:
      - "9090:9090"
    depends_on:
      - booking-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: booking-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}  # .env 에서. 기본값 admin/admin 을 그대로 두지 않는다.
      GF_USERS_ALLOW_SIGN_UP: "false"                       # 누구나 가입 불가
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
