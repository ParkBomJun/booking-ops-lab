# 서버(VM) 전용 override. 로컬은 docker-compose.yml 하나만, 서버는 두 파일을 겹쳐 쓴다:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 겹치기 규칙: 같은 키는 뒤 파일이 이긴다. 단 리스트(ports 등)는 "합쳐지므로",
# 지우려면 `!reset`, 통째로 바꾸려면 `!override` 태그가 필요하다 (compose 2.24+).
# 여기서 바꾸는 것: ① 이미지 출처(빌드 → GHCR) ② 포트 노출 ③ 로그 상한 ④ Prometheus 디스크 상한.
# 바꾸지 않는 것: restart: unless-stopped (기본 파일 그대로). 장애 대응 중 사람이 `docker stop` 한 컨테이너가
# VM 재부팅 뒤 멋대로 되살아나지 않게 하려는 것. 재부팅으로 내려간 컨테이너는 unless-stopped 도 다시 띄운다.

# `x-` 로 시작하는 최상위 키는 compose 가 무시하는 확장 필드. YAML 앵커(&이름)로 한 번 정의하고 *이름 으로 재사용한다.
x-logging: &default-logging
  driver: json-file   # Docker 기본 드라이버. 컨테이너 stdout/stderr 를 호스트의 JSON 파일에 쓴다
  options:
    max-size: "10m"   # 파일 하나가 10MB 를 넘으면 회전(rotate)
    max-file: "3"     # 회전 파일 3개까지 보관 → 컨테이너당 최대 30MB, 7개면 210MB.
                      # 이 상한이 없으면 로그가 디스크를 다 채운다 (훈련 6번, DiskUsageHigh).

services:
  postgres:
    # DB 포트를 호스트에 열지 않는다. 다른 컨테이너는 내부 네트워크(postgres:5432)로 붙고,
    # 백업·복구 스크립트는 `docker compose exec postgres pg_dump` 로 컨테이너 안에서 실행한다.
    ports: !reset []
    logging: *default-logging

  booking-api:
    build: !reset null   # VM 은 빌드하지 않는다. 소스가 아니라 CI 가 만든 이미지를 받는다
    # IMAGE_TAG 는 .env 에 있고 deploy.sh 가 바꾼다. 값은 git 커밋 SHA.
    # `:?` 는 "없으면 에러" — 태그가 비면 `booking-api:` 같은 잘못된 이름으로 조용히 실패하는 대신 바로 멈춘다.
    image: ghcr.io/parkbomjun/booking-ops-lab/booking-api:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    # missing: 로컬에 없을 때만 pull. SHA 태그는 내용이 바뀌지 않으므로 매번 받을 이유가 없고,
    # 롤백 때 이전 이미지가 이미 디스크에 있으면 GHCR 이 죽어 있어도 롤백이 된다.
    pull_policy: missing
    # 127.0.0.1 에만 바인딩: VM 바깥에서는 NSG 와 무관하게 절대 닿을 수 없다(루프백은 라우팅되지 않는다).
    # deploy.sh/healthcheck.sh 가 호스트에서 `curl 127.0.0.1:8080/healthz` 로 확인한다 (이미지에 curl 이 없으므로).
    # 외부 클라이언트가 필요해지면 "0.0.0.0:8080:8080" + NSG 규칙으로 연다.
    ports: !override
      - "127.0.0.1:8080:8080"
    logging: *default-logging

  mock-forwarder:
    build: !reset null
    image: ghcr.io/parkbomjun/booking-ops-lab/mock-forwarder:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    pull_policy: missing
    ports: !override
      - "127.0.0.1:8082:8082"
    logging: *default-logging

  worker:
    build: !reset null
    image: ghcr.io/parkbomjun/booking-ops-lab/worker:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    pull_policy: missing
    ports: !override
      - "127.0.0.1:8081:8081"
    logging: *default-logging

  prometheus:
    # UI 는 VM 안에서만. 밖에서 보려면 SSH 터널: ssh -L 9090:127.0.0.1:9090 <vm>
    ports: !override
      - "127.0.0.1:9090:9090"
    # command 는 리스트지만 합쳐지지 않고 통째로 교체된다 (command/entrypoint 는 예외). 그래서 전부 다시 적는다.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB   # 시간과 크기 중 먼저 닿는 쪽에서 오래된 블록을 지운다. 작은 VM 디스크 보호.
      - --web.enable-lifecycle
    logging: *default-logging

  alertmanager:
    ports: !override
      - "127.0.0.1:9093:9093"
    logging: *default-logging

  grafana:
    # 3000 은 기본 파일의 "3000:3000"(모든 인터페이스) 을 그대로 둔다. Grafana 가 운영 화면이라 브라우저로 봐야 한다.
    # 접근 통제는 두 겹: NSG 가 3000 을 내 IP 에서만 허용 + Grafana 로그인(가입 금지, .env 비밀번호).
    # 더 조이려면 "127.0.0.1:3000:3000" 으로 바꾸고 SSH 터널로만 본다.
    logging: *default-logging
